# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 4

project_name: codefall

builds:
  - id: codefall
    main: ./cli/cmd/codefall
    binary: codefall
    env:
      - CGO_ENABLED=0
    # Replaces GoReleaser's default flags, which stamp main.version and friends — variables this
    # binary does not declare. buildinfo_test.go holds these to the package and its variables.
    ldflags:
      - -s -w
      - -X github.com/lividlabs/codefall/cli/internal/shared/buildinfo.version={{.Version}}
      - -X github.com/lividlabs/codefall/cli/internal/shared/buildinfo.commit={{.Commit}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

checksum:
  name_template: "checksums.txt"
