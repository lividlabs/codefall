name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # packslip's attest step (the default) needs both of these.
  id-token: write
  attestations: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The steps below run only in the push that cut the release — the one whose
      # merge of the release PR happened — because the tag has to exist before any
      # binary build makes sense.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        if: ${{ steps.release.outputs.release_created }}
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The tag input is explicit because this job runs on the push to main
      # that cut the release, not on the tag itself.
      - uses: jdx/packslip@v1.2.0
        if: ${{ steps.release.outputs.release_created }}
        with:
          tag: ${{ steps.release.outputs.tag_name }}
          artifacts: dist/*.tar.gz dist/*.zip
          bin: codefall

      # A re-run of this job finds the release already cut and skips this step, so a failed
      # publish is retried with the publish-release workflow instead.
      - name: Publish to install.codefall.dev
        if: ${{ steps.release.outputs.release_created }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}
        run: scripts/publish-release.sh "${{ steps.release.outputs.version }}" dist


