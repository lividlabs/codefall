# Lands a document stack without a merge click. Adapted from the starting point in codefall's
# docs/recipes/landing-document-stacks.md for a throwaway private repository:
#
# - It fires when a design pull request is opened and is not a draft, as well as when a draft is
#   marked ready. A design whose status is Ready is opened non-draft, so `ready_for_review` alone
#   would never fire for it.
# - It merges with the default GITHUB_TOKEN. The throwaway has no branch protection, so no bypass
#   actor and no stored token are needed. A real repository needs the ruleset change the recipe
#   describes and a token that can pass it.
# - The path allowlist is exactly the recipe's. It is an allowlist of paths, never an inspection of
#   content.
name: land-document-stack
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
permissions:
  contents: write
  pull-requests: write
jobs:
  land:
    if: startsWith(github.head_ref, 'design/') && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Only document paths
        run: |
          set -euo pipefail
          allow='^(docs/(visions|specs|bugs|mockups|designs|adrs)/|\.codefall/(reviews|tests)/|\.beads/interactions\.jsonl$)'
          # HEAD is the pull request's merge commit onto its base, so main...HEAD is the whole stack.
          if git diff --name-only "origin/${{ github.event.repository.default_branch }}...HEAD" | grep -vE "$allow"; then
            echo "non-document paths in the stack; a person merges this one" >&2
            exit 1
          fi
      - name: Merge the stack up to this pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh extension install github/gh-stack
          gh stack merge "${{ github.event.pull_request.number }}" --squash --yes
